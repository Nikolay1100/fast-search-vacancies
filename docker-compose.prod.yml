services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fastsearch_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastsearch_network

  # Redis for Caching
  redis:
    image: redis:alpine
    container_name: fastsearch_redis
    restart: always
    networks:
      - fastsearch_network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fastsearch_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fastsearch_network

  # Laravel API (PHP-FPM)
  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_REF_SLUG}
    container_name: fastsearch_backend
    restart: always
    depends_on:
      - postgres
      - redis
      - rabbitmq
    env_file: .env.prod
    networks:
      - fastsearch_network

  # Telegram Consumer
  worker:
    image: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_REF_SLUG}
    container_name: fastsearch_worker
    restart: always
    command: php artisan app:consume-telegram
    depends_on:
      - backend
    env_file: .env.prod
    networks:
      - fastsearch_network

  # Laravel Queue Worker
  worker_notifications:
    image: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_REF_SLUG}
    container_name: fastsearch_worker_notifications
    restart: always
    command: php artisan queue:work rabbitmq --queue=default,notifications
    depends_on:
      - backend
    env_file: .env.prod
    networks:
      - fastsearch_network

  # Python Parser
  parser:
    image: ${CI_REGISTRY_IMAGE}/parser:${CI_COMMIT_REF_SLUG}
    container_name: fastsearch_parser
    restart: always
    volumes:
      - ./sessions:/sessions
    depends_on:
      - rabbitmq
    env_file: .env.prod
    networks:
      - fastsearch_network

  # Vue Frontend + Main Nginx Proxy
  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_REF_SLUG}
    container_name: fastsearch_frontend
    restart: always
    ports:
      - "8099:80"
    depends_on:
      - backend
    networks:
      - fastsearch_network

networks:
  fastsearch_network:
    driver: bridge

volumes:
  postgres_data:
  parser_session:
