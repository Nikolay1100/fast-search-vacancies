stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

services:
  - docker:24.0.5-dind

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build_backend:
  stage: build
  image: docker:24.0.5
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  only:
    - main

build_frontend:
  stage: build
  image: docker:24.0.5
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
  only:
    - main

build_parser:
  stage: build
  image: docker:24.0.5
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE/parser:$CI_COMMIT_REF_SLUG ./parser
    - docker push $CI_REGISTRY_IMAGE/parser:$CI_COMMIT_REF_SLUG
  only:
    - main

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p 56777 $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - ssh -p 56777 root@$SERVER_IP "mkdir -p /var/www/fast-search"
    - scp -P 56777 docker-compose.prod.yml root@$SERVER_IP:/var/www/fast-search/docker-compose.yml
    - |
      ssh -p 56777 root@$SERVER_IP "cd /var/www/fast-search && \
      echo \"CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE\" > .env && \
      echo \"CI_COMMIT_REF_SLUG=$CI_COMMIT_REF_SLUG\" >> .env && \
      cat .env.prod >> .env && \
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && \
      docker-compose pull && \
      docker-compose up -d && \
      echo "Waiting for services to start..." && \
      sleep 15 && \
      docker-compose exec -T backend php artisan migrate --force"
  only:
    - main
  when: manual
